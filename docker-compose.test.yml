# Backends for the env-gated live integration tests.
#
#   make test-integration-up     # start the stack and wait for readiness
#   make test-integration        # start the stack + run the full suite
#   make test-integration-down   # stop the stack and drop volumes
#
# Every port and credential below matches the DP_TEST_* / KAFKA_TEST_BROKER env
# vars the tests read (see the Makefile). Tests skip cleanly when a backend is
# absent, so partial stacks are fine.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: FlogoPass123
      POSTGRES_DB: dp
    ports: [ "15432:5432" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d dp" ]
      interval: 5s
      timeout: 3s
      retries: 30

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Flogo-Pass-123"
      MSSQL_PID: Developer
    ports: [ "11433:1433" ]

  oracle:
    image: gvenzl/oracle-free:slim
    environment:
      ORACLE_PASSWORD: FlogoPass123
      APP_USER: dpuser
      APP_USER_PASSWORD: FlogoPass123
    ports: [ "11521:1521" ]
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 40

  minio:
    image: minio/minio:latest
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: [ "9000:9000", "9001:9001" ]

  # One-shot: create the bucket the S3 tests expect. Idempotent (-p).
  minio-init:
    image: minio/mc:latest
    depends_on: [ minio ]
    restart: "no"
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - "until mc alias set loc http://minio:9000 minioadmin minioadmin; do sleep 1; done; mc mb -p loc/dp-test-bucket; echo bucket-ready"

  redis:
    image: redis:7-alpine
    ports: [ "16379:6379" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka-native:4.1.0
    ports: [ "9092:9092" ]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

  gcs:
    image: fsouza/fake-gcs-server:latest
    command: [ "-scheme", "http", "-public-host", "127.0.0.1:4443", "-port", "4443" ]
    ports: [ "4443:4443" ]

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: [ "azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--skipApiVersionCheck" ]
    ports: [ "10000:10000" ]
