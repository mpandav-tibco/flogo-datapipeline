# Backends for the env-gated live integration tests.
#
#   make test-integration-up     # start the stack and wait for readiness
#   make test-integration        # start the stack + run the full suite
#   make test-integration-down   # stop the stack and drop volumes
#
# Every port and credential below matches the DP_TEST_* / KAFKA_TEST_BROKER env
# vars the tests read (see the Makefile). Tests skip cleanly when a backend is
# absent, so partial stacks are fine.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: FlogoPass123
      POSTGRES_DB: dp
    ports: [ "15432:5432" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d dp" ]
      interval: 5s
      timeout: 3s
      retries: 30

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Flogo-Pass-123"
      MSSQL_PID: Developer
    ports: [ "11433:1433" ]

  oracle:
    image: gvenzl/oracle-free:slim
    environment:
      ORACLE_PASSWORD: FlogoPass123
      APP_USER: dpuser
      APP_USER_PASSWORD: FlogoPass123
    ports: [ "11521:1521" ]
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 40

  minio:
    image: minio/minio:latest
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: [ "9000:9000", "9001:9001" ]

  # One-shot: create the bucket the S3 tests expect. Idempotent (-p).
  minio-init:
    image: minio/mc:latest
    depends_on: [ minio ]
    restart: "no"
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - "until mc alias set loc http://minio:9000 minioadmin minioadmin; do sleep 1; done; mc mb -p loc/dp-test-bucket; echo bucket-ready"

  redis:
    image: redis:7-alpine
    ports: [ "16379:6379" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    # NOTE: apache/kafka-native (the GraalVM native-image build) does NOT
    # correctly support SASL — its broker-side SASL server creation
    # (org.apache.kafka.common.security.authenticator.SaslServerAuthenticator
    # .createSaslServer) fails for every mechanism (confirmed 2026-08-05: even
    # a CORRECT password gets no further than an "UnsupportedStrategy"-rooted
    # connection drop, vs. this JVM image's clean "Authentication failed:
    # Invalid username or password" for a wrong one) — almost certainly a
    # missing GraalVM reflection-config entry for the SASL provider classes in
    # that image's native-image build. Plain TLS (mutual TLS, the MTLS
    # listener below) is unaffected and works on both images. Switched to the
    # standard JVM-based image so the CLIENTSASL listener actually works;
    # slower container startup (~10s vs ~5s) is an acceptable one-time cost.
    image: apache/kafka:4.1.0
    ports: [ "9092:9092", "9094:9094", "9095:9095" ]
    # MTLS (:9094, mutual TLS) and CLIENTSASL (:9095, SASL/PLAIN) are
    # additional listeners for the live SASL/TLS adversarial tests
    # (source/kafka/sasl_tls_test.go) — PLAINTEXT (:9092) stays untouched so
    # every other test keeps working unmodified.
    #
    # Listener name "MTLS" (not e.g. "SSL" or "CLIENTSSL") is DELIBERATE: this
    # image's entrypoint (/etc/kafka/docker/configure) does a blunt substring
    # check for "SSL://" anywhere in KAFKA_ADVERTISED_LISTENERS and, if found,
    # forces BOTH a global ssl.keystore.password AND ssl.key.password — but
    # Kafka's PEM keystore type rejects a keystore password outright
    # ("SSL key store password cannot be specified with PEM format"), so any
    # listener name containing "SSL://" fails to start. A listener name
    # without that substring sidesteps the entrypoint's global block entirely,
    # letting the normal listener-specific `KAFKA_LISTENER_NAME_<NAME>_SSL_*`
    # properties (set below, no keystore password) apply cleanly instead.
    # ("CLIENTSASL" is similarly deliberate: the entrypoint's SASL check only
    # fires on the literal substring "SASL_", which "CLIENTSASL" doesn't
    # contain, so it's likewise inert — the per-listener sasl.jaas.config
    # property below is all that's needed.)
    #
    # TLS materials: run scripts/gen-kafka-test-certs.sh once to generate
    # .kafka-certs/ (gitignored) before bringing this listener up.
    volumes:
      - ./.kafka-certs:/etc/kafka/secrets:ro
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,MTLS://:9094,CLIENTSASL://:9095"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,MTLS://localhost:9094,CLIENTSASL://localhost:9095"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,MTLS:SSL,CLIENTSASL:SASL_PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # --- MTLS: mutual TLS (broker requires the client to present a cert
      # signed by our test CA), no SASL. PEM key has no passphrase, so no
      # ssl.key.password / ssl.keystore.password is set (Kafka's PEM keystore
      # type rejects a keystore password outright).
      KAFKA_LISTENER_NAME_MTLS_SSL_KEYSTORE_TYPE: "PEM"
      KAFKA_LISTENER_NAME_MTLS_SSL_KEYSTORE_LOCATION: "/etc/kafka/secrets/server.keystore.pem"
      KAFKA_LISTENER_NAME_MTLS_SSL_TRUSTSTORE_TYPE: "PEM"
      KAFKA_LISTENER_NAME_MTLS_SSL_TRUSTSTORE_LOCATION: "/etc/kafka/secrets/ca.crt"
      KAFKA_LISTENER_NAME_MTLS_SSL_CLIENT_AUTH: "required"
      # --- CLIENTSASL: SASL/PLAIN over plaintext, no TLS ---
      KAFKA_SASL_ENABLED_MECHANISMS: "PLAIN"
      KAFKA_LISTENER_NAME_CLIENTSASL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin" password="admin-secret"
        user_admin="admin-secret" user_testuser="testpass123";

  gcs:
    image: fsouza/fake-gcs-server:latest
    command: [ "-scheme", "http", "-public-host", "127.0.0.1:4443", "-port", "4443" ]
    ports: [ "4443:4443" ]

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: [ "azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--skipApiVersionCheck" ]
    ports: [ "10000:10000" ]
