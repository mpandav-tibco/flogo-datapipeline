version: "3.8"

# ---------------------------------------------------------------------------
# Example 17 — Local Kafka cluster (single-broker, no authentication)
#
# Starts:
#   zookeeper  — Kafka coordination service (port 2181)
#   kafka      — Single-broker Kafka 3.6 (ports 9092 internal, 29092 host)
#
# Quick-start:
#   docker compose up -d
#   docker compose ps          # confirm both containers are healthy
#   ./produce.sh               # inject 20 sensor messages
#   flogo-datapipeline run kafka-streaming.datapipeline
#   docker compose down        # tear down when done
#
# Notes:
#   - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true means the "sensor-data" topic
#     is created automatically on first produce, so no manual topic creation
#     step is required.
#   - The listener split (INTERNAL on 9092, EXTERNAL on 29092) is necessary
#     so that producers/consumers on the host machine and containers inside
#     the Docker network both connect to the same broker with the right
#     advertised address.
#   - For SASL/SCRAM production config see the README "Production SASL/SCRAM"
#     section; replace this file's kafka service with the annotated version.
# ---------------------------------------------------------------------------

services:

  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    volumes:
      - zookeeper_data:/bitnami/zookeeper
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.6
    container_name: kafka
    ports:
      - "9092:9092"    # internal listener  — used by flogo-datapipeline on host
      - "29092:29092"  # external listener  — used by Docker-networked clients
    environment:
      # Zookeeper connection
      KAFKA_CFG_ZOOKEEPER_CONNECT: "zookeeper:2181"

      # Listener configuration
      # INTERNAL  → broker-to-broker and host-side clients (localhost:9092)
      # EXTERNAL  → clients inside the Docker network    (kafka:29092)
      KAFKA_CFG_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://localhost:9092,EXTERNAL://kafka:29092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      # Topic defaults
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: "1"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"

      # Retention — keep messages for 1 hour so reprocessing works in demos
      KAFKA_CFG_LOG_RETENTION_HOURS: "1"

      ALLOW_PLAINTEXT_LISTENER: "yes"
    depends_on:
      zookeeper:
        condition: service_healthy
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s

volumes:
  zookeeper_data:
  kafka_data:
