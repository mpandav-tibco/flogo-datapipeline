# MinIO (S3) credentials for the collector. These name-map to the pipeline's
# accessKeyIdEnv / secretAccessKeyEnv — the pipeline JSON only references the
# env-var NAMES, never the secret values.
#
# Defaults match the host `miniobench` container (minioadmin/minioadmin).
# For a real deployment, replace with a sealed/external secret.
apiVersion: v1
kind: Secret
metadata:
  name: adidas-minio-creds
  namespace: logging
type: Opaque
stringData:
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
