# Six "BW app" workloads (one per team namespace, 2 replicas each = 12 pods).
# Each pod is an arm64-native emitter that writes BWCE-style console logs to
# stdout (containerd persists them to /var/log/pods, where the collector tails).
# Image: bwce-emitter:arm64-local (built by collector/build-image.sh).
#
# NOTE: this stands in for mpandav/demo-rest-app:1.0, which is an x86-64-only
# BWCE 6.12 image and cannot run on the arm64 minikube nodes (see REPORT.md).
# The emitted log format is byte-for-byte the BWCE AppNode console format.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: team-alpha
  labels: { app.kubernetes.io/name: order-service, app.kubernetes.io/part-of: bw-apps }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: order-service } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: order-service, app.kubernetes.io/part-of: bw-apps }
    spec:
      containers:
        - name: bwapp
          image: bwce-emitter:arm64-local
          imagePullPolicy: IfNotPresent
          env:
            - { name: APP_NAME, value: "OrderService" }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: RATE_PER_SEC, value: "6" }
            - { name: ERROR_EVERY, value: "35" }
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits: { cpu: "150m", memory: "96Mi" }
---
