apiVersion: v1
kind: Namespace
metadata:
  name: s5-team-01
  labels: { tier: apps, poc-scenario: s5 }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: order-service
  namespace: s5-team-01
spec:
  ttlSecondsAfterFinished: 5
  backoffLimit: 0
  template:
    metadata: { labels: { app.kubernetes.io/name: order-service, app.kubernetes.io/part-of: bw-apps, poc-scenario: s5 } }
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 1
      containers:
      - name: bwapp
        image: bwce-emitter:poc
        imagePullPolicy: Never
        resources: { requests: { cpu: 10m, memory: 24Mi }, limits: { memory: 64Mi } }
        env:
          - { name: APP_NAME, value: order-service }
          - { name: RATE_PER_SEC, value: "50" }
          - { name: ERROR_EVERY, value: "40" }
          - { name: EMIT_TOTAL, value: "3000" }
          - { name: EXIT_WHEN_DONE, value: "true" }
          - name: POD_NAMESPACE
            valueFrom: { fieldRef: { fieldPath: metadata.namespace } }

