apiVersion: v1
kind: Namespace
metadata:
  name: s6-team-01
  labels: { tier: apps, poc-scenario: s6 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: s6-team-01
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: order-service } }
  template:
    metadata: { labels: { app.kubernetes.io/name: order-service, app.kubernetes.io/part-of: bw-apps, poc-scenario: s6 } }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: bwapp
        image: bwce-emitter:poc
        imagePullPolicy: Never
        resources: { requests: { cpu: 10m, memory: 24Mi }, limits: { memory: 64Mi } }
        env:
          - { name: APP_NAME, value: order-service }
          - { name: RATE_PER_SEC, value: "10" }
          - { name: ERROR_EVERY, value: "40" }
          - { name: EMIT_TOTAL, value: "8000" }
          - { name: EXIT_WHEN_DONE, value: "false" }
          - name: POD_NAMESPACE
            valueFrom: { fieldRef: { fieldPath: metadata.namespace } }

